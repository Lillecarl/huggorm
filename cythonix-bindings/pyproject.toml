[build-system]
requires = ["setuptools", "nanobind", "cythonix-idl"]
build-backend = "setuptools.build_meta"

[project]
name = "cythonix-bindings"
version = "0.1.0"
description = "nanobind bindings, written from declarations"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["cythonix_bindings*"]
