[build-system]
requires = ["setuptools", "protobuf"]
build-backend = "setuptools.build_meta"

[project]
name = "cythonix-generated"
version = "0.1.0"
description = "Generated RPC stubs for fake-library (AST codegen)"
requires-python = ">=3.10"
dependencies = ["cythonix-bindings"]

[tool.setuptools.packages.find]
include = ["cythonix_generated*"]

[tool.setuptools.package-data]
cythonix_generated = ["manifest.json"]
