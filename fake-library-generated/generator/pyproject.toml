[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "fake-library-codegen"
version = "0.1.0"
description = "IDL-to-async-wrapper codegen for fake_library_generated"
requires-python = ">=3.10"

[project.scripts]
codegen-generate = "codegen.generate:main"
codegen-smoke = "codegen.smoke_test:main"

[tool.setuptools.packages.find]
where = ["src"]
