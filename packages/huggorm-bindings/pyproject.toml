[build-system]
requires = ["setuptools", "nanobind", "huggorm-gen", "huggorm-decl"]
build-backend = "setuptools.build_meta"

[project]
name = "huggorm-bindings"
version = "0.1.0"
description = "nanobind bindings, written from declarations"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["huggorm_bindings*"]

# Nix's `get-env.sh`, which a wheel build copies in before setup.py runs.
[tool.setuptools.package-data]
huggorm_bindings = ["get-env.sh"]
