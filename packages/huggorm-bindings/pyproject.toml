[build-system]
requires = ["setuptools", "nanobind"]
build-backend = "huggorm_bindings_backend"
backend-path = ["_backend"]

[project]
name = "huggorm-bindings"
license = "Apache-2.0"
license-files = ["LICENSE"]
version = "0.1.0"
description = "nanobind bindings, written from declarations"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["huggorm_bindings*"]

# Nix's `get-env.sh` and `COPYING`, which a wheel build copies in before
# setup.py runs, the NOTICE naming whose terms they travel under, and the
# licence texts of the bundled libraries, which both builds copy in.
[tool.setuptools.package-data]
huggorm_bindings = ["get-env.sh", "COPYING.nix", "NOTICE", "licenses/README", "licenses/*/*"]
