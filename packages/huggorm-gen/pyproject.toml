[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "huggorm-gen"
version = "0.1.0"
description = "The emitters: one declaration set, two backends"
requires-python = ">=3.14"
dependencies = ["huggorm-dsl", "huggorm-decl"]

# protobuf is pygen's alone - it builds a FileDescriptorSet - and the
# C++ build has no use for it. An extra rather than a dependency, so
# compiling the bindings does not drag a protobuf runtime in.
[project.optional-dependencies]
proto = ["protobuf"]

[project.scripts]
huggorm-cppgen = "huggorm_gen.cppgen.generate:main"
huggorm-pygen = "huggorm_gen.pygen.generate:main"
huggorm-smoke = "huggorm_gen.pygen.smoke_test:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
huggorm_gen = ["py.typed"]
