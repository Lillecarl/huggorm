[build-system]
requires = ["setuptools", "protobuf"]
build-backend = "setuptools.build_meta"

[project]
name = "huggorm-codegen"
version = "0.1.0"
description = "PXD-and-bindings-to-async-wrapper codegen for huggorm_generated"
requires-python = ">=3.10"

[project.scripts]
codegen-generate = "codegen.generate:main"
codegen-smoke = "codegen.smoke_test:main"

[tool.setuptools.packages.find]
where = ["src"]
