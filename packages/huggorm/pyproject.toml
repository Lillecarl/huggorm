[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "huggorm"
version = "0.1.0"
description = "Python library over the generated Nix bindings"
requires-python = ">=3.11"
# Floors, never ceilings: a wheel installed beside a distribution's own
# packages has to take the versions already there (huggorm#107).
# protobuf 4.22 is the first with `message_factory.GetMessageClass`.
# anyio 4 is the first whose task groups always raise ExceptionGroup.
dependencies = [
    "huggorm-bindings",
    "huggorm-generated",
    "anyio>=4",
    "asyncinotify>=4",
    "googleapis-common-protos",
    "grpclib>=0.4",
    "protobuf>=4.22",
]

[tool.setuptools.packages.find]
# tests/ is not shipped: it is a suite, not a module anyone imports.
include = ["huggorm*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# anyio's runner, not pytest-asyncio's. auto: every async test runs
# under it without a marker of its own, the same way asyncio_mode did.
anyio_mode = "auto"
# A hung test is the failure mode this suite is most exposed to: a
# server that never came up, a handle that never resolved, a native
# crash that took a thread with it. Fail instead of waiting.
timeout = 180
addopts = "-q --strict-markers --strict-config"
# Which tests need the machine, and which need nothing.
#
# The marker names the REQUIREMENT, not the venue, and the default is
# hermetic on purpose. Forgetting to mark a live test makes it fail in
# the build, loudly, and someone fixes it that afternoon. The other
# polarity - marking the hermetic ones - fails by SILENCE: an unmarked
# test drops out of the build gate and nobody finds out.
#
# So a bare `pytest` runs everything, which is what a devshell wants,
# and the sandboxed build passes `-m "not live"` (huggorm#37).
markers = [
    "live: needs the machine's own Nix store - a daemon, a db, or a path that exists. Cannot run in a build sandbox",
]
